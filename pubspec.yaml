name: swipe_clean
description: "D Swipe Cleaner: limpiador de galería estilo Tinder para Android de uso personal"
publish_to: 'none'
version: 1.4.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Acceso eficiente a fotos y capturas del dispositivo Android
  photo_manager: ^3.1.2
  # Guarda el progreso (qué fotos ya revisaste) entre sesiones
  shared_preferences: ^2.2.3
  # Íconos y animaciones
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Genera el ícono de la app a partir de assets/icon/
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2F2E90"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

name: swipe_clean
description: "D Swipe Cleaner: limpiador de galería estilo Tinder para Android de uso personal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Acceso eficiente a fotos y capturas del dispositivo Android
  photo_manager: ^3.1.2
  # Guarda el progreso (qué fotos ya revisaste) entre sesiones
  shared_preferences: ^2.2.3
  # Íconos y animaciones
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
